name: ScorchNova Browser Game
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/web.yml'
      - 'ScorchNova_Android_GitHub_Upload_NEU.zip'
      - 'visual_fx/**'
      - 'godot_project/scripts/terrain.gd'
      - 'godot_project/scripts/game.gd'
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project
        run: |
          unzip -q ScorchNova_Android_GitHub_Upload_NEU.zip -d extracted
          cp -a extracted/ScorchNova_v1.0/. .
          rm -rf extracted
          cp godot_project/scripts/terrain.gd scripts/terrain.gd
          cp godot_project/scripts/game.gd scripts/game.gd
          sed -i 's/var enabled := not p\["cpu"\]/var enabled: bool = not p["cpu"]/' scripts/game.gd
          sed -i 's/var cost := {"armor"/var cost: int = {"armor"/' scripts/game.gd
      - name: Install Godot and templates
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q templates.tpz -d template_extract
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          cp -a template_extract/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Set Web export preset
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("export_presets.cfg")
          s = p.read_text() if p.exists() else ""
          if 'platform="Web"' not in s:
              nums = [int(n) for n in re.findall(r'\[preset\.(\d+)\]', s)]
              n = max(nums, default=-1) + 1
              s += f"""
          [preset.{n}]
          name="Web"
          platform="Web"
          runnable=true
          advanced_options=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="web/index.html"
          encryption_include_filters=""
          encryption_exclude_filters=""

          [preset.{n}.options]
          custom_template/debug=""
          custom_template/release=""
          variant/extensions_support=false
          vram_texture_compression/for_desktop=true
          vram_texture_compression/for_mobile=false
          html/export_icon=true
          html/custom_html_shell=""
          html/head_include=""
          html/canvas_resize_policy=2
          html/focus_canvas_on_start=true
          html/experimental_virtual_keyboard=false
          progressive_web_app/enabled=false
          """
          p.write_text(s)
          print(s)
          PY
      - name: Import project
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit
      - name: Export browser game
        run: |
          mkdir -p web
          ./Godot_v4.3-stable_linux.x86_64 --headless --verbose --path . --export-debug Web web/index.html
          test -s web/index.html
          # Native Godot visuals replace the previous HTML overlay.
      - uses: actions/upload-artifact@v4
        with:
          name: ScorchNova-Browser-Spiel
          path: web/
          if-no-files-found: error
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package website for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/
      - name: Deploy ScorchNova website
        id: deployment
        uses: actions/deploy-pages@v4

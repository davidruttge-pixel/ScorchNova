name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
      - 'ScorchNova_Android_GitHub_Upload_NEU.zip'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Godot project
        run: |
          unzip -q ScorchNova_Android_GitHub_Upload_NEU.zip -d extracted
          cp -a extracted/ScorchNova_v1.0/. .
          rm -rf extracted
          sed -i 's/var enabled := not p\["cpu"\]/var enabled: bool = not p["cpu"]/' scripts/game.gd
          sed -i 's/var cost := {"armor"/var cost: int = {"armor"/' scripts/game.gd
          test -f project.godot
      - name: Install Godot 4.3 and templates
        run: |
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -fL --retry 3 -o templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -q templates.tpz -d template_extract
          cp -a template_extract/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Use Java 17 for Godot Android export
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK and debug signing
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "JAVA_HOME=$JAVA_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Import project
        run: ./Godot_v4.3-stable_linux.x86_64 --headless --path . --editor --quit
      - name: Configure Godot Android settings and validate SDK
        run: |
          set -euo pipefail
          SETTINGS="$HOME/.config/godot/editor_settings-4.3.tres"
          mkdir -p "$(dirname "$SETTINGS")"
          cat > "$SETTINGS" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp "$SETTINGS" "$HOME/.config/godot/editor_settings-4.tres"
          test -s "$SETTINGS"
          test -s "$HOME/.android/debug.keystore"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -f "$ANDROID_HOME/build-tools/34.0.0/aapt2"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
          echo "Editor settings path: $SETTINGS"
          cat "$SETTINGS"
          echo "Android export preset:"
          cat export_presets.cfg
      - name: Reimport with configured Android editor settings
        run: |
          ./Godot_v4.3-stable_linux.x86_64 --headless --verbose --path . --editor --quit
      - name: Inspect Android configuration without editor scripting
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          for file in "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.3.tres"; do
            test -s "$file"
            echo "Verified settings file: $file"
            grep -E 'export/android/(android_sdk_path|java_sdk_path|debug_keystore)' "$file"
          done
          test -s "$HOME/.android/debug.keystore"
          test -f "$ANDROID_HOME/platforms/android-34/android.jar"
          test -f "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
      - name: Build debug APK
        run: |
          mkdir -p build
          ./Godot_v4.3-stable_linux.x86_64 --headless --verbose --path . --export-debug Android build/ScorchNova-debug.apk
          test -s build/ScorchNova-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ScorchNova-Android-APK
          path: build/ScorchNova-debug.apk
          if-no-files-found: error
